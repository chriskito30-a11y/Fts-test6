<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Messages — Fais Ton Show</title>
<link href="./manifest.json" rel="manifest"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="./assets/css/fts-chat.css?v=8" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link href="assets/css/pages/messages.css?v=1" rel="stylesheet"/></head>

<body>
<!-- ═══ AUTH LOADING ════════════════════════════════════════════ -->
<div class="auth-loading" id="auth-loading">
<div class="auth-logo">FAIS TON <span>SHOW</span></div>
<div class="spinner"></div>
</div>
<!-- ═══ APP ══════════════════════════════════════════════════════ -->
<div class="app u-messages-inline-1" id="app">
<!-- ══ SIDEBAR ══ -->
<div class="sidebar">
<div class="sb-hdr">
<div class="sb-avatar" id="my-avatar">?</div>
<div class="sb-title">MESSAGES</div>
<button class="btn-compose" data-fts-handler-1="" title="Nouveau message">✏️</button>
</div>
<div class="sb-search">
<input class="search-inp" data-fts-handler-2="" placeholder="Rechercher une conversation…" type="text"/>
</div>
<div class="conv-list" id="conv-list">
<div class="conv-empty">
<span class="conv-empty-icon">✉️</span>
<p>Aucune conversation.<br/>Commence un message !</p>
</div>
</div>
<div class="notif-mini">
<button class="btn-notif" data-fts-handler-3="" id="btn-notif">🔕 Activer les notifs</button>
</div>
<nav class="sb-nav">
<a class="snav" href="membres.html"><span class="ico">👤</span><span>Membres</span></a>
<a class="snav" href="forum.html"><span class="ico">💬</span><span>Forum</span></a>
</nav>
</div><!-- /sidebar -->
<!-- ══ MAIN ══ -->
<div class="main" id="main">
<!-- Vide (desktop uniquement) -->
<div class="chat-empty" id="chat-empty">
<div class="chat-empty-ring">✉️</div>
<div class="chat-empty-title">FAIS TON <span>SHOW</span></div>
<div class="chat-empty-sub">Sélectionne une conversation ou envoie un nouveau message privé.</div>
<button class="btn-start" data-fts-handler-4="">✏️ Nouveau message</button>
</div>
<!-- Zone chat -->
<div class="chat-zone" id="chat-zone">
<div class="chat-hdr">
<button class="btn-back" data-fts-handler-5="">←</button>
<div class="chat-hdr-av" id="chat-av"></div>
<div class="chat-hdr-info">
<div class="chat-hdr-name" id="chat-name">…</div>
<div class="chat-hdr-sub" id="chat-sub"></div>
</div>
<button class="btn-chat-del" data-fts-handler-6="" id="btn-delete-conv" title="Supprimer la conversation">🗑</button>
</div>
<div class="messages" id="messages"></div>
<div class="input-area">
<div class="input-pill">
<textarea class="msg-input" data-fts-handler-7="" data-fts-handler-8="" id="msg-input" placeholder="Message…" rows="1"></textarea>
</div>
<button class="btn-send" data-fts-handler-9="">➤</button>
</div>
</div>
</div><!-- /main -->
</div><!-- /app -->
<!-- ═══ MODAL NOUVEAU MESSAGE ════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modal">
<div class="modal">
<div class="modal-grip"></div>
<div class="modal-hdr">
<div class="modal-title">Nouveau message</div>
<button class="btn-modal-close" data-fts-handler-10="">✕</button>
</div>
<div class="type-tabs">
<div class="type-tab on" data-fts-handler-11="" id="tab-d">👤 Message privé</div>
<div class="type-tab" data-fts-handler-12="" id="tab-g">👥 Groupe privé</div>
</div>
<div class="u-messages-inline-2" id="gname-wrap">
<label class="modal-lbl">Nom du groupe</label>
<input class="modal-field" id="gname" placeholder="Ex : Équipe Théâtre…" type="text"/>
</div>
<label class="modal-lbl" id="pick-lbl">Destinataire</label>
<input class="picker-search" data-fts-handler-13="" id="picker-q" placeholder="Rechercher…" type="text"/>
<div class="user-list" id="user-list"></div>
<div class="sel-info" id="sel-info"></div>
<div class="modal-err" id="modal-err"></div>
<div class="modal-btns">
<button class="btn-mcancel" data-fts-handler-14="">Annuler</button>
<button class="btn-mstart" data-fts-handler-15="">Démarrer →</button>
</div>
</div>
</div>
<script src="./assets/js/fts-utils.js"></script>
<script src="./assets/js/fts-firebase.js"></script>
<script src="./assets/js/fts-chat.js?v=8"></script>
<script src="assets/js/fts-pwa.js"></script>
<script src="assets/js/services/auth.service.js?v=1"></script>
<script src="assets/js/services/users.service.js?v=1"></script>
<script src="assets/js/services/resources.service.js?v=1"></script>
<script src="assets/js/services/events.service.js?v=1"></script>
<script src="assets/js/services/forum.service.js?v=1"></script>
<script src="assets/js/services/messages.service.js?v=1"></script>
<script src="assets/js/services/content.service.js?v=1"></script>
<script src="assets/js/services/notifications.service.js?v=1"></script>
<script src="assets/js/services/season.service.js?v=1"></script>
<script src="assets/js/pages/messages.js?v=1"></script>
</body>
</html>
