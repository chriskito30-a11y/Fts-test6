<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Saison — Fais Ton Show</title>
<link href="/manifest.json" rel="manifest"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/fts.css" rel="stylesheet"/><link href="assets/css/pages/saison-admin.css?v=1" rel="stylesheet"/>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body class="has-glow">
<div class="auth-loading" id="auth-loading"><div class="logo">FAIS TON <span>SHOW</span></div><div class="spinner"></div><div class="sub">Vérification accès admin…</div></div>
<div class="admin-shell" id="admin-shell">
<div class="topbar"><div><div class="logo">ADMIN <span>SAISON</span></div><div class="sub">Tarifs · liens d’inscription · contenus publics</div></div><div class="actions"><a class="btn btn-sm btn-dark" href="admin.html">Admin hub</a><a class="btn btn-sm btn-dark" href="saison.html">Voir la page</a><a class="btn btn-sm btn-dark" href="contenus-admin.html">Admin contenus</a><a class="btn btn-sm btn-dark" href="calendrier-admin.html">Admin calendrier</a><button class="btn btn-sm btn-dark" data-fts-handler-1="">Exporter JSON</button><button class="btn btn-sm" data-fts-handler-2="">Publier</button><button class="btn-outline" data-fts-handler-3="">Déconnexion</button></div></div>
<div class="layout">
<div class="grid">
<div class="card-admin"><div class="mini-title">Activités</div><div class="activity-list" id="activity-list"></div><button class="btn-gold u-saison-admin-inline-1" data-fts-handler-4="">+ Ajouter une activité</button><hr class="divider"/><div class="mini-title">Import / sauvegarde</div><textarea class="import-area" id="json-area" placeholder="Colle ici un export JSON si besoin…"></textarea><button class="btn-outline u-saison-admin-inline-2" data-fts-handler-5="">Importer ce JSON</button></div>
<div class="card-admin">
<div class="mini-title">Réglages généraux</div>
<div class="form-grid">
<div class="field"><label>Titre</label><input id="m-title"/></div><div class="field"><label>Saison</label><input id="m-year"/></div>
<div class="field full"><label>Slogan</label><input id="m-slogan"/></div><div class="field full"><label>Lien d'inscription par défaut</label><input id="m-link" placeholder="https://www.helloasso.com/..."/></div>
</div>
<hr class="divider"/><div class="mini-title">Activité sélectionnée</div><div class="muted-note" id="empty-edit">Sélectionne une activité à gauche.</div>
<div class="u-saison-admin-inline-3" id="editor">
<div class="form-grid">
<div class="field"><label>Nom</label><input id="a-name"/></div><div class="field"><label>Icône</label><input id="a-icon"/></div>
<div class="field"><label>Sous-titre</label><input id="a-subtitle"/></div><div class="field"><label>Badge</label><input id="a-badge" placeholder="Offert, Nouveau…"/></div>
<div class="field"><label>Ordre</label><input id="a-order" type="number"/></div><div class="field"><label>Visible</label><select id="a-active"><option value="true">Oui</option><option value="false">Non</option></select></div>
</div>
<div class="mini-title">Formules / cases tarifs et inscription</div><div id="offers"></div>
<div class="actions"><button class="btn-gold" data-fts-handler-6="">+ Ajouter une formule</button><button class="btn-outline danger" data-fts-handler-7="">Supprimer l'activité</button></div>
</div>
<div class="msg" id="msg"></div>
</div>
</div>
</div>
</div>
<script src="assets/js/fts-utils.js"></script>
<script src="assets/js/fts-firebase.js"></script>
<script src="assets/js/services/auth.service.js?v=1"></script>
<script src="assets/js/services/users.service.js?v=1"></script>
<script src="assets/js/services/resources.service.js?v=1"></script>
<script src="assets/js/services/events.service.js?v=1"></script>
<script src="assets/js/services/forum.service.js?v=1"></script>
<script src="assets/js/services/messages.service.js?v=1"></script>
<script src="assets/js/services/content.service.js?v=1"></script>
<script src="assets/js/services/notifications.service.js?v=1"></script>
<script src="assets/js/services/season.service.js?v=1"></script>
<script src="assets/js/pages/saison-admin.js?v=1"></script>
</body>
</html>
