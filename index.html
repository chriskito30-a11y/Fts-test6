<!-- Styles spécifiques à cette page -->
<style>
/* Layout centré vertical (spécifique à l'accueil) */
html, body { height: 100%; }

.wrapper {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
}

/* Header d'accueil */
.site-header {
  text-align: center;
  margin-bottom: 2.5rem;
  animation: fadeUp .6s ease both;
}

.site-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3rem, 10vw, 5.5rem);
  letter-spacing: .04em;
  color: var(--white);
  line-height: .95;
}

.site-title span { color: var(--red); }

.site-slogan {
  font-size: .85rem;
  color: var(--muted);
  margin-top: .7rem;
}

.header-link {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  margin-top: 1rem;
  font-size: .75rem;
  padding: .4rem .9rem;
  border-radius: 2px;
  text-decoration: none;
  transition: all .2s;
}

.header-link-gold {
  color: var(--gold);
  border: 1px solid rgba(201,168,76,.3);
}

.header-link-gold:hover { background: rgba(201,168,76,.08); }

.header-link-muted {
  color: var(--muted);
  border: 1px solid rgba(255,255,255,.1);
}

.header-link-muted:hover { background: rgba(255,255,255,.04); color: var(--white); }

/* Carte questionnaire */
.questionnaire-card {
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--r-lg);
  backdrop-filter: blur(8px);
  padding: 2rem;
  animation: fadeUp .6s .1s ease both;
}

/* Étapes */
.step-label {
  font-size: .6rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1rem;
}

.step-question {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem;
  letter-spacing: .03em;
  margin-bottom: .4rem;
  line-height: 1.1;
}

.step-desc {
  font-size: .8rem;
  color: var(--muted);
  margin-bottom: 1.4rem;
}

/* Options de sélection */
.options { display: flex; flex-direction: column; gap: .6rem; }

.option {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .9rem 1rem;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all .18s;
  user-select: none;
}

.option:hover    { background: rgba(212,32,26,.07); border-color: rgba(212,32,26,.3); }
.option.selected { background: rgba(212,32,26,.1);  border-color: var(--red); }

.opt-icon  { font-size: 1.4rem; line-height: 1; flex-shrink: 0; }
.opt-title { font-size: .88rem; font-weight: 500; }
.opt-desc  { font-size: .72rem; color: var(--muted); margin-top: .15rem; }

/* Boutons d'action */
.step-actions {
  display: flex;
  gap: .7rem;
  margin-top: 1.4rem;
}

.btn-step-back {
  padding: .65rem 1rem;
  background: transparent;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--r-sm);
  color: var(--muted);
  font-size: .78rem;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font-body);
}

.btn-step-back:hover { border-color: rgba(255,255,255,.3); color: var(--white); }

.btn-step-next {
  flex: 1;
  padding: .65rem 1.2rem;
  background: var(--red);
  border: none;
  border-radius: var(--r-sm);
  color: var(--white);
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  font-family: var(--font-body);
}

.btn-step-next:disabled { background: rgba(212,32,26,.3); cursor: not-allowed; }
.btn-step-next:not(:disabled):hover { background: var(--red-dark); }

/* Destination finale */
.destination { text-align: center; animation: fadeUp .4s ease both; }

.dest-badge {
  display: inline-block;
  background: rgba(201,168,76,.1);
  border: 1px solid rgba(201,168,76,.3);
  color: var(--gold);
  font-size: .65rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  padding: .3rem .8rem;
  border-radius: 2px;
  margin-bottom: 1.2rem;
}

.dest-icon   { font-size: 3rem; margin-bottom: .8rem; }

.dest-title  {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: .03em;
  margin-bottom: .5rem;
}

.dest-desc {
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 1.2rem;
}

.dest-details { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.5rem; }

.dest-detail {
  display: flex;
  justify-content: space-between;
  font-size: .75rem;
  padding: .4rem .7rem;
  background: rgba(255,255,255,.03);
  border-radius: var(--r-sm);
}

.dest-detail-key { color: var(--muted); }
.dest-detail-val { color: var(--white); font-weight: 500; }

.btn-helloasso {
  display: block;
  padding: .9rem 1.5rem;
  background: var(--red);
  color: var(--white);
  text-decoration: none;
  border-radius: var(--r-sm);
  font-size: .85rem;
  font-weight: 600;
  letter-spacing: .03em;
  text-align: center;
  transition: background .2s;
  margin-bottom: .8rem;
}

.btn-helloasso:hover { background: var(--red-dark); }

/* Erreur */
.error-wrap { text-align: center; padding: 1.5rem 0; }
.error-icon { font-size: 2rem; margin-bottom: .6rem; }
.error-msg  { font-size: .8rem; color: #aa5a5a; line-height: 1.5; }


/* Paiement public événements / stages — V5 */
.btn-helloasso.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.public-pay-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;padding:16px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px)}
.public-pay-modal.open{display:flex}.public-pay-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#151515;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:26px 26px 18px 18px;padding:22px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.public-pay-close{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:1.35rem}.public-pay-kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}.public-pay-card h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;margin:.25rem 2.5rem .2rem 0}.public-pay-summary{color:rgba(255,255,255,.72);line-height:1.5}.public-pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.public-pay-grid label{display:grid;gap:6px;font-size:.78rem;color:rgba(255,255,255,.72);font-weight:800}.public-pay-grid input{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;padding:.8rem .9rem;font:inherit}.public-pay-full{grid-column:1/-1}.public-pay-submit{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:900}.public-pay-msg{min-height:20px;margin-top:10px;color:#ffb3ad;text-align:center}@media(max-width:620px){.public-pay-grid{grid-template-columns:1fr}.public-pay-modal{padding:0}.public-pay-card{border-radius:26px 26px 0 0}}

</style>

<body class="has-noise has-glow">
<div class="wrapper">

  <header class="site-header">
    <div class="eyebrow" id="h-eyebrow"></div>
    <div class="site-title" id="h-title"></div>
    <div class="site-slogan" id="h-slogan"></div>
    <a id="h-membres" class="header-link header-link-gold" href="./membres.html">
      🎭 Déjà adhérent·e ? → Accéder à mon espace
    </a>
    <br>
    <a class="header-link header-link-muted" href="saison.html">
      📅 Découvrir la saison 2026/2027 →
    </a>
  </header>

  <div class="questionnaire-card" id="card">
    <div class="loading-wrap" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Chargement en cours…</div>
    </div>
  </div>

  <footer class="page-footer" id="footer"></footer>

</div>

<!-- Firebase + utilitaires partagés -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/fts-utils.js"></script>
<script src="assets/js/fts-firebase.js"></script>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────
   Seules les données spécifiques à cette page restent ici.
   Les options finales sont chargées depuis Firebase.
   ──────────────────────────────────────────────────────────── */
const CFG = {
  name:    "Fais Ton Show",
  eyebrow: "École des arts de la scène",
  slogan:  "On est pas là pour faire semblant, on est là pour faire le Show !",
  footer:  "Fais Ton Show · contact@faistonshow.fr",

  step1: {
    question: "C'est ta première fois avec nous ?",
    desc:     "Pour te guider vers les bonnes options.",
  },

  step2: {
    question:   "Que souhaites-tu faire ?",
    desc:       "Dis-nous si tu fais déjà partie de l'aventure.",
    categories: [
      { id: "adhesion", icon: "🎫", title: "Prendre mon adhésion",       desc: "Rejoindre l'association pour la saison",    profiles: ["new"] },
      { id: "event",    icon: "🎪", title: "Acheter une place",           desc: "Spectacles, soirées, showcases…",          profiles: ["member", "new"] },
      { id: "goodie",   icon: "🛍️", title: "Commander des goodies",       desc: "T-shirts, accessoires, merch…",           profiles: ["member", "new"] },
      { id: "renew",    icon: "🔄", title: "Renouveler mon adhésion",     desc: "Rempiler pour une nouvelle saison",        profiles: ["member"] },
    ],
  },

  step3Questions: {
    adhesion: { q: "Quel type d'adhésion ?",    d: "Choisis la formule adaptée à ta situation." },
    event:    { q: "Quel événement t'intéresse ?", d: "Sélectionne le prochain show qui t'attire." },
    goodie:   { q: "Que cherches-tu ?",          d: "Notre boutique officielle sur HelloAsso." },
    renew:    { q: "Ton type d'adhésion ?",       d: "Même formule ou changement de catégorie ?" },
  },
};

/* ── ÉTAT ────────────────────────────────────────────────────── */
const state = { step1: null, step2: null, step3: null };
let step3Options = {};

/* ── CHARGEMENT QUESTIONNAIRE FIREBASE ────────────────────────── */
async function loadQuestionnaire() {
  const db = FTS.initFirebase();
  const rows = [];

  // 1) Source publique du questionnaire : fts_content/questionnaire.
  // Elle reste chargée même si la lecture de fts_events est refusée par les règles Firebase.
  try {
    const snap = await db.ref('fts_content/questionnaire').once('value');
    const root = snap.val() || {};

    // Format officiel : fts_content/questionnaire/options/{id}
    const opts = root.options || {};
    Object.keys(opts).forEach(key => {
      const v = opts[key] || {};
      if (v.active === false || v.status === 'inactive') return;
      rows.push({ id: key, ...v });
    });

    // Compatibilité ancien format : fts_content/questionnaire/{id}
    Object.keys(root).forEach(key => {
      if (key === 'options' || key === 'settings') return;
      const v = root[key];
      if (!v || typeof v !== 'object') return;
      if (!(v.type || v.title || v.titre || v.link || v.lien)) return;
      if (v.active === false || v.status === 'inactive') return;
      rows.push({ id: key, ...v });
    });
  } catch (e) {
    console.warn('[FTS] Impossible de charger fts_content/questionnaire :', e);
  }

  step3Options = buildStep3Options(rows);

  // 2) Source calendrier : fts_events. Si elle est lisible publiquement, elle remplace
  // les anciennes options événement. Si elle est bloquée, on garde les options
  // synchronisées par calendrier-admin dans fts_content/questionnaire/options.
  try {
    const eventOptions = await loadUpcomingEventOptions(db);
    if (eventOptions.length) {
      step3Options.event = {
        question: CFG.step3Questions.event.q,
        desc: CFG.step3Questions.event.d,
        options: eventOptions
      };
    }
  } catch (e) {
    console.warn('[FTS] fts_events non accessible depuis l’accueil, utilisation du miroir questionnaire :', e);
  }

  // 3) Sécurité : si aucun événement futur n'est exploitable, on ne casse pas les autres choix.
  initPage();
}

function normalizeEventTs(v) {
  return Number(v.dateTs || v.startTs || v.ts || 0);
}

async function loadUpcomingEventOptions(db) {
  const snap = await db.ref('fts_events').once('value');
  const events = [];
  const startOfToday = new Date();
  startOfToday.setHours(0, 0, 0, 0);

  if (snap.exists()) {
    snap.forEach(child => {
      const v = child.val() || {};
      if (v.active === false || v.status === 'inactive') return;

      const ts = normalizeEventTs(v);
      const title = v.name || v.nom || v.title || v.titre || v.n || '';
      const date  = v.dateLabel || v.date || v.d || '';
      const hour  = v.hour || v.heure || v.time || v.h || '';
      const place = v.location || v.lieu || v.l || '';
      const link  = v.url || v.link || v.lien || v.u || '#';

      if (!title || (!date && !ts)) return;
      if (ts && ts < startOfToday.getTime()) return;

      const detail = [];
      if (date) detail.push(['Date', hour ? `${date} · ${hour}` : date]);
      if (place) detail.push(['Lieu', place]);

      events.push({
        id: child.key,
        icon: v.icon || '🎪',
        title,
        desc: v.description || v.desc || v.type || '',
        detail,
        link,
        eventId: child.key,
        paymentEnabled: v.paymentEnabled === true || v.payEnabled === true,
        paymentType: v.paymentType || v.saleType || (String(v.type || '').toLowerCase().includes('stage') ? 'stage_registration' : 'event_ticket'),
        priceCents: Number(v.priceCents || v.amountCents || 0) || 0,
        destTitle: title,
        destDesc: v.description || v.desc || (date ? (hour ? `${date} · ${hour}` : date) : '') || '' ,
        ts,
        date
      });
    });
  }

  return events.sort((a, b) => {
    if (a.ts || b.ts) return (a.ts || Number.MAX_SAFE_INTEGER) - (b.ts || Number.MAX_SAFE_INTEGER);
    return String(a.date).localeCompare(String(b.date), 'fr');
  });
}

function buildStep3Options(rows) {
  const result = {};
  rows
    .sort((a, b) => Number(a.order || 999) - Number(b.order || 999))
    .forEach((row, index) => {
      const type = String(row.type || '').toLowerCase().trim();
      const title = row.title || row.titre || '';
      if (!type || !title) return;

      if (!result[type]) {
        const q3 = CFG.step3Questions[type] || { q: 'Choisis une option', d: '' };
        result[type] = { question: q3.q, desc: q3.d, options: [] };
      }

      let detail = [];
      if (Array.isArray(row.details)) {
        detail = row.details
          .map(d => [d.key || d.cle || '', d.value || d.valeur || ''])
          .filter(d => d[0] && d[1]);
      }
      if (!detail.length) {
        if ((row.detail1_cle || row.detail1Key) && (row.detail1_valeur || row.detail1Value)) detail.push([row.detail1_cle || row.detail1Key, row.detail1_valeur || row.detail1Value]);
        if ((row.detail2_cle || row.detail2Key) && (row.detail2_valeur || row.detail2Value)) detail.push([row.detail2_cle || row.detail2Key, row.detail2_valeur || row.detail2Value]);
      }

      const option = {
        id:        row.id || (type + '_' + index),
        icon:      row.icon || '🎭',
        title:     title,
        desc:      row.description || row.desc || '',
        detail,
        link:      row.link || row.lien || '#',
        eventId:   row.eventKey || row.eventId || row.id || '',
        paymentEnabled: row.paymentEnabled === true || row.payEnabled === true,
        paymentType: row.paymentType || row.saleType || (type === 'event' && String(row.typeLabel || row.category || '').toLowerCase().includes('stage') ? 'stage_registration' : 'event_ticket'),
        priceCents: Number(row.priceCents || row.amountCents || 0) || 0,
        destTitle: row.destTitle || row.dest_titre || row.destTitleText || title,
        destDesc:  row.destDesc || row.dest_desc || row.description || row.desc || '',
        ts:        Number(row.dateTs || row.startTs || row.ts || 0),
        date:      row.dateLabel || row.date || row.d || ''
      };

      // Les options événement synchronisées depuis calendrier-admin disparaissent
      // automatiquement quand la date est passée.
      if (type === 'event' && option.ts) {
        const startOfToday = new Date();
        startOfToday.setHours(0, 0, 0, 0);
        if (option.ts < startOfToday.getTime()) return;
      }

      result[type].options.push(option);
    });
  Object.keys(result).forEach(type => {
    result[type].options.sort((a, b) => {
      if ((a.ts || 0) || (b.ts || 0)) return (a.ts || Number.MAX_SAFE_INTEGER) - (b.ts || Number.MAX_SAFE_INTEGER);
      return String(a.title || '').localeCompare(String(b.title || ''), 'fr');
    });
  });
  return result;
}

function initPage() {
  // Titre
  const parts = CFG.name.split(' ');
  const last  = parts.pop();
  document.getElementById('h-eyebrow').textContent = CFG.eyebrow;
  document.getElementById('h-title').innerHTML =
    (parts.length ? parts.join(' ') + '<br>' : '') + '<span>' + last + '</span>';
  document.getElementById('h-slogan').textContent = CFG.slogan;
  document.getElementById('footer').textContent   = CFG.footer;
  renderStep1();
}

/* ── ÉTAPE 1 ─────────────────────────────────────────────────── */
function renderStep1() {
  document.getElementById('card').innerHTML = `
    <div class="step-label">Étape 1 / 3</div>
    <div class="step-question">${CFG.step1.question}</div>
    <div class="step-desc">${CFG.step1.desc}</div>
    <div class="options" id="s1-opts">
      <div class="option" data-id="new" onclick="selectStep1(this)">
        <div class="opt-icon">✨</div>
        <div class="opt-text">
          <div class="opt-title">Je découvre l'association</div>
          <div class="opt-desc">Première fois que j'entends parler de vous</div>
        </div>
      </div>
      <div class="option" data-id="member" onclick="selectStep1(this)">
        <div class="opt-icon">🎭</div>
        <div class="opt-text">
          <div class="opt-title">Je suis déjà adhérent·e</div>
          <div class="opt-desc">J'ai déjà ma carte membre cette saison</div>
        </div>
      </div>
    </div>
    <div class="step-actions">
      <button class="btn-step-next" id="btn1" disabled onclick="goStep2()">Continuer →</button>
    </div>`;
}

function selectStep1(el) {
  document.querySelectorAll('#s1-opts .option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.step1 = el.dataset.id;
  document.getElementById('btn1').disabled = false;
}

/* ── ÉTAPE 2 ─────────────────────────────────────────────────── */
function goStep2() {
  const cats = CFG.step2.categories.filter(c => c.profiles.includes(state.step1));
  document.getElementById('card').innerHTML = `
    <div class="step-label">Étape 2 / 3</div>
    <div class="step-question">${CFG.step2.question}</div>
    <div class="step-desc">${CFG.step2.desc}</div>
    <div class="options" id="s2-opts">
      ${cats.map(c => `
        <div class="option" data-id="${c.id}" onclick="selectStep2(this)">
          <div class="opt-icon">${c.icon}</div>
          <div class="opt-text">
            <div class="opt-title">${c.title}</div>
            <div class="opt-desc">${c.desc}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="step-actions">
      <button class="btn-step-back" onclick="renderStep1()">← Retour</button>
      <button class="btn-step-next" id="btn2" disabled onclick="goStep3()">Continuer →</button>
    </div>`;
}

function selectStep2(el) {
  document.querySelectorAll('#s2-opts .option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.step2 = el.dataset.id;
  document.getElementById('btn2').disabled = false;
}

/* ── ÉTAPE 3 ─────────────────────────────────────────────────── */
function goStep3() {
  if (state.step2 === 'adhesion' || state.step2 === 'renew') {
    document.getElementById('card').innerHTML = '<div class="destination"><div class="dest-badge">Saison Fais Ton Show</div><div class="dest-icon">🎭</div><div class="dest-title">Direction la page Saison</div><div class="dest-desc">Tu vas pouvoir choisir l’activité, le groupe et la formule adaptée.</div><a class="btn-helloasso" href="saison.html">Voir les adhésions →</a><button class="btn-ghost" onclick="restart()">Recommencer</button></div>';
    setTimeout(function(){ window.location.href = 'saison.html'; }, 700);
    return;
  }
  if (state.step2 === 'goodie') {
    document.getElementById('card').innerHTML = '<div class="destination"><div class="dest-badge">Boutique</div><div class="dest-icon">🛍️</div><div class="dest-title">Direction la boutique</div><div class="dest-desc">Retrouve les articles Fais Ton Show disponibles.</div><a class="btn-helloasso" href="boutique.html">Voir la boutique →</a><button class="btn-ghost" onclick="restart()">Recommencer</button></div>';
    setTimeout(function(){ window.location.href = 'boutique.html'; }, 700);
    return;
  }
  const q3 = step3Options[state.step2];
  if (!q3 || !q3.options.length) {
    document.getElementById('card').innerHTML = `
      <div class="error-wrap">
        <div class="error-icon">🔍</div>
        <div class="error-msg">Aucune option disponible pour le moment.<br>Contactez l'association.</div>
      </div>`;
    return;
  }
  document.getElementById('card').innerHTML = `
    <div class="step-label">Étape 3 / 3</div>
    <div class="step-question">${q3.question}</div>
    <div class="step-desc">${q3.desc}</div>
    <div class="options" id="s3-opts">
      ${q3.options.map(o => `
        <div class="option" data-id="${o.id}" onclick="selectStep3(this)">
          <div class="opt-icon">${o.icon}</div>
          <div class="opt-text">
            <div class="opt-title">${o.title}</div>
            <div class="opt-desc">${o.desc}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="step-actions">
      <button class="btn-step-back" onclick="goStep2()">← Retour</button>
      <button class="btn-step-next" id="btn3" disabled onclick="showDest()">Voir où s'inscrire →</button>
    </div>`;
}

function selectStep3(el) {
  document.querySelectorAll('#s3-opts .option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.step3 = el.dataset.id;
  document.getElementById('btn3').disabled = false;
}

/* ── DESTINATION ─────────────────────────────────────────────── */
function showDest() {
  const q3  = step3Options[state.step2];
  const opt = q3.options.find(o => o.id === state.step3);
  if (!opt) return;

  const details = opt.detail.map(d =>
    `<div class="dest-detail">
      <span class="dest-detail-key">${d[0]}</span>
      <span class="dest-detail-val">${d[1]}</span>
    </div>`
  ).join('');

  document.getElementById('card').innerHTML = `
    <div class="destination">
      <div class="dest-badge">Prêt à rejoindre le show</div>
      <div class="dest-icon">${opt.icon}</div>
      <div class="dest-title">${FTS.esc(opt.destTitle || opt.title)}</div>
      <div class="dest-desc">${FTS.esc(opt.destDesc  || opt.desc)}</div>
      ${details ? '<div class="dest-details">' + details + '</div>' : ''}
      ${opt.paymentEnabled && opt.priceCents ? `<button type="button" class="btn-helloasso" onclick="openPublicEventPayment('${FTS.esc(opt.eventId || opt.id)}')">${opt.paymentType === 'stage_registration' ? 'Réserver le stage' : 'Acheter ma place'} · ${(Number(opt.priceCents)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}</button>` : `<a href="${FTS.esc(opt.link || '#')}" class="btn-helloasso" target="_blank" rel="noopener">Voir les informations →</a>`}
      <button class="btn-ghost" onclick="restart()">Recommencer depuis le début</button>
    </div>`;
}


function paymentWorkerUrl(){
  return String((window.FTS && FTS.PAYMENT && FTS.PAYMENT.workerUrl) || 'https://fts-helloasso-api.gros-christophe.workers.dev').replace(/\/+$/,'');
}
function selectedEventOptionById(eventId){
  const q3 = step3Options.event || { options: [] };
  return (q3.options || []).find(o => String(o.eventId || o.id) === String(eventId));
}
function ensurePublicPayModal(){
  if (document.getElementById('public-pay-modal')) return;
  const div=document.createElement('div');
  div.id='public-pay-modal';
  div.className='public-pay-modal';
  div.innerHTML=`<div class="public-pay-card"><button type="button" class="public-pay-close" data-public-pay-close>×</button><div class="public-pay-kicker">Paiement sécurisé HelloAsso</div><h2 id="public-pay-title">Réservation</h2><p id="public-pay-summary" class="public-pay-summary"></p><form id="public-pay-form"><div class="public-pay-grid"><label>Prénom payeur<input name="firstName" required></label><label>Nom payeur<input name="lastName" required></label><label>Email payeur<input name="email" type="email" required></label><label>Téléphone<input name="phone" type="tel" required></label><label class="public-pay-full">Nom du participant<input name="participantName" required placeholder="Élève, enfant ou personne concernée"></label><label>Nombre de place(s)<input name="quantity" type="number" min="1" max="20" value="1" required></label></div><button class="public-pay-submit" type="submit">Continuer vers HelloAsso</button><div id="public-pay-msg" class="public-pay-msg"></div></form></div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e => { if(e.target === div || e.target.closest('[data-public-pay-close]')) div.classList.remove('open'); });
  document.getElementById('public-pay-form').addEventListener('submit', submitPublicEventPayment);
}
let publicPaymentEvent=null;
function openPublicEventPayment(eventId){
  const opt=selectedEventOptionById(eventId);
  if(!opt) return;
  publicPaymentEvent=opt;
  ensurePublicPayModal();
  document.getElementById('public-pay-title').textContent = opt.paymentType === 'stage_registration' ? 'Réserver un stage' : 'Acheter une place';
  document.getElementById('public-pay-summary').innerHTML = `<strong>${FTS.esc(opt.title || '')}</strong><br>${FTS.esc(opt.destDesc || opt.desc || '')}<br><strong>${(Number(opt.priceCents)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}</strong> / personne`;
  const form=document.getElementById('public-pay-form'); form.reset(); form.quantity.value='1';
  document.getElementById('public-pay-msg').textContent='';
  document.getElementById('public-pay-modal').classList.add('open');
}
async function submitPublicEventPayment(e){
  e.preventDefault();
  const opt=publicPaymentEvent;
  if(!opt) return;
  const form=e.currentTarget;
  const submit=form.querySelector('button[type="submit"]');
  const msg=document.getElementById('public-pay-msg');
  if(submit){ submit.disabled=true; submit.textContent='Préparation…'; }
  msg.textContent='';
  try{
    const res=await fetch(paymentWorkerUrl() + '/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ type:opt.paymentType || 'event_ticket', source:'index.html', eventId:opt.eventId || opt.id, quantity:Math.max(1,Math.min(20,Math.round(Number(form.quantity.value||1))||1)), payer:{firstName:form.firstName.value,lastName:form.lastName.value,email:form.email.value,phone:form.phone.value}, participant:{name:form.participantName.value} }) });
    const data=await res.json().catch(()=>null);
    if(!res.ok || !data || data.ok === false || !data.redirectUrl) throw new Error((data&&data.error)||'checkout_failed');
    window.location.href=data.redirectUrl;
  }catch(err){
    console.warn('[FTS paiement public]',err);
    msg.textContent = err && err.message === 'event_full' ? 'Il n’y a plus assez de places disponibles.' : 'Impossible de lancer le paiement. Vérifie les informations puis réessaie.';
    if(submit){ submit.disabled=false; submit.textContent='Continuer vers HelloAsso'; }
  }
}

function restart() {
  state.step1 = state.step2 = state.step3 = null;
  renderStep1();
}

/* ── START ───────────────────────────────────────────────────── */
loadQuestionnaire();
</script>
