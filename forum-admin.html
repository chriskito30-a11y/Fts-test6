<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forum Admin — Fais Ton Show</title>
<link href="./manifest.json" rel="manifest"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/fts.css" rel="stylesheet"/><link href="assets/css/pages/forum-admin.css?v=1" rel="stylesheet"/>

<!-- Firebase SDK — Auth ajouté -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>
<!-- ── ÉCRAN DE CHARGEMENT AUTH ──────────────────────────────── -->
<div class="auth-loading" id="auth-loading">
<div class="auth-loading-logo">FAIS TON SHOW</div>
<div class="spinner"></div>
<div class="auth-loading-sub">Vérification accès admin…</div>
</div>
<!-- ── DASHBOARD ─────────────────────────────────────────────── -->
<div class="dashboard" id="dashboard">
<div class="dash-hdr">
<div>
<div class="dash-logo">FAIS TON SHOW</div>
<div class="dash-sub">Admin Forum</div>
</div>
<div class="dash-actions"><a class="btn-admin-link" href="admin.html">🛡 Admin hub</a>
<a class="btn-admin-link" href="calendrier-admin.html">📅 Admin calendrier</a><a class="btn-admin-link" href="saison-admin.html">📅 Admin saison</a>
<button class="btn-logout" data-fts-handler-1="">Déconnexion</button>
</div>
</div>
<div class="tabs-bar">
<button class="tab-btn active" data-fts-handler-2="">
      ⏳ En attente <span class="badge" id="badge-pending">0</span>
</button>
<button class="tab-btn" data-fts-handler-3="">
      👥 Membres actifs <span class="badge u-forum-admin-inline-1" id="badge-members">0</span>
</button>
<button class="tab-btn" data-fts-handler-4="">
      💬 Messages
    </button>
</div>
<div class="dash-body">
<div class="tab-content active" id="tab-pending">
<div class="sec-title">Inscriptions en attente</div>
<div id="pending-list"></div>
</div>
<div class="tab-content" id="tab-members">
<div class="sec-title">Membres actifs</div>
<div id="members-list"></div>
</div>
<div class="tab-content" id="tab-messages">
<div class="sec-title">Modération messages</div>
<div class="ch-selector" id="ch-selector"></div>
<div id="msg-list"></div>
</div>
</div>
</div><!-- /dashboard -->
<!-- ── MODALE MODIFICATION ────────────────────────────────────── -->
<div class="modal-overlay hidden" id="mod-modal">
<div class="modal">
<h3>Modifier l'accès</h3>
<input id="mod-uid" type="hidden"/>
<label class="modal-label">Rôle</label>
<div class="role-selector" id="mod-role-selector">
<div class="role-pill" data-fts-handler-5="" data-role="member">👤 Membre</div>
<div class="role-pill" data-fts-handler-6="" data-role="prof">🎓 Prof</div>
<div class="role-pill" data-fts-handler-7="" data-role="admin">🛡 Admin</div>
</div>
<label class="modal-label">Discipline(s) — clique pour sélectionner</label>
<div class="pill-container" id="mod-cat-pills"></div>
<div id="mod-sub-groups"></div>
<!-- Section enfant(s) — visible seulement si le compte a des enfants -->
<div class="u-forum-admin-inline-2" id="mod-enfants-section">
<div id="mod-enfants-blocks"></div>
</div>
<div class="modal-row">
<button class="btn-cancel" data-fts-handler-8="">Annuler</button>
<button class="btn-confirm" data-fts-handler-9="">Enregistrer</button>
</div>
</div>
</div>
<script src="assets/js/fts-utils.js"></script>
<script src="assets/js/fts-firebase.js"></script>
<script src="assets/js/fts-pwa.js"></script>
<script src="assets/js/services/auth.service.js?v=1"></script>
<script src="assets/js/services/users.service.js?v=1"></script>
<script src="assets/js/services/resources.service.js?v=1"></script>
<script src="assets/js/services/events.service.js?v=1"></script>
<script src="assets/js/services/forum.service.js?v=1"></script>
<script src="assets/js/services/messages.service.js?v=1"></script>
<script src="assets/js/services/content.service.js?v=1"></script>
<script src="assets/js/services/notifications.service.js?v=1"></script>
<script src="assets/js/services/season.service.js?v=1"></script>
<script src="assets/js/pages/forum-admin.js?v=3"></script>
</body>
</html>
